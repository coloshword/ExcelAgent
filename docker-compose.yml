services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.prod
    image: webimage
    ports: 
      - "8000:8000"
    
    depends_on:
      - redis

    volumes:
      - ./server:/app/server
    
  worker:
    build: 
      context: .
      dockerfile: ./server/Dockerfile
    working_dir: /app
    env_file:
      - ../.env.prod
    command: "celery -A server.worker.celery worker --loglevel=info"
    volumes:
      - ./server:/app/server
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - web
      - redis
  redis:
    image: redis:7