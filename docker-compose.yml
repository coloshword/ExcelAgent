services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.prod
    image: webimage
    ports: 
      - "8000:8000"
    
    depends_on:
      - redis

    volumes:
      - ./server:/usr/src/app
    
  worker:
    build: 
      context: .
      dockerfile: server/Dockerfile
    command: sh -c "cd server && celery -A worker.celery worker --loglevel=info"
    volumes:
      - ./server:/usr/src/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
      - redis
  redis:
    image: redis:7